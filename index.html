<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LuluFilterCoffee</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LuluFilterCoffee">
<meta name="theme-color" content="#efede7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13100e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — header, scrolling journal pane, bottom tab bar; content column max 640px; data in mono like a brew scale readout */
:root{
  --bg:#efede7; --surface:#fffdf9; --surface-2:#e6e2d8; --ink:#211b17; --muted:#6c6258; --line:#dbd4c8;
  --accent:#1e5d63; --accent-ink:#ffffff; --accent-soft:#d6e6e5; --amber:#b8721a;
  --sour:#7d8418; --bitter:#8a3d2c; --danger:#b3261e; --good:#2c7a4c;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13100e; --surface:#1d1916; --surface-2:#2a2420; --ink:#f0e9e1; --muted:#a59a8e; --line:#362e28;
  --accent:#6cbcc2; --accent-ink:#0b1a1b; --accent-soft:#1d3335; --amber:#e3a24a;
  --sour:#c3c85a; --bitter:#e0917c; --danger:#ff8a80; --good:#6fcf97; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13100e; --surface:#1d1916; --surface-2:#2a2420; --ink:#f0e9e1; --muted:#a59a8e; --line:#362e28;
  --accent:#6cbcc2; --accent-ink:#0b1a1b; --accent-soft:#1d3335; --amber:#e3a24a;
  --sour:#c3c85a; --bitter:#e0917c; --danger:#ff8a80; --good:#6fcf97; color-scheme:dark}

html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
.gut{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.col{max-width:640px;margin:0 auto}

/* header */
.appbar{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.appbar .col{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mark{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
.mark b{font-weight:800;color:var(--accent)}
.sub{font-size:13px;color:var(--muted);white-space:nowrap}

main{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
main .col{padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}

/* tab bar */
.tabs{border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .col{display:grid;grid-template-columns:repeat(5,1fr)}
.month{font-family:var(--display);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.month span{font:400 13px var(--body);color:var(--muted)}
.fcount{font:500 12px var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.rest{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.rest .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.rest .bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.rest .bar2 div{height:100%;background:var(--amber)}
.rest.done .bar2 div{background:var(--good)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:500 12px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.2}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:10px}

/* type */
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;display:flex;align-items:center;gap:10px;text-wrap:balance}
h3{font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.n{font-family:var(--mono);font-size:12px;font-weight:500;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

/* summary strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:500}
.stat .k{font-size:12px;color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);border-radius:999px;padding:7px 13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sm{font-size:12px;padding:3px 9px;cursor:default}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scrollx{overflow-x:auto;margin-inline:-4px;padding:2px 4px}
.scrollx .chips{flex-wrap:nowrap}
.badge{font:500 11px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}

/* inputs */
label,.lbl{font-size:14px;font-weight:600;display:block}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],input[type=date],select,textarea{
  width:100%;box-sizing:border-box;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font:400 16px var(--body)}
input[type=number]{font-family:var(--mono)}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.unit{position:relative}
.unit input{padding-right:42px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:400 14px var(--mono);color:var(--muted);pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hint{font-size:13px;color:var(--muted);line-height:1.45}

/* sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
details.sec summary{cursor:pointer;list-style:none;font-family:var(--display);font-weight:600;font-size:17px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"＋";float:right;color:var(--muted)}
details.sec[open] summary::after{content:"－"}

/* ratio readout */
.readout{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:14px;padding:12px 14px;flex-wrap:wrap}
.readout .big{font:500 28px var(--mono);letter-spacing:-.02em}
.readout .k{font-size:12px;color:var(--muted)}

/* buttons */
.btn{appearance:none;border:0;border-radius:14px;min-height:50px;padding:0 18px;font:600 16px var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.savebar{position:sticky;bottom:0;padding-block:12px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px}
.savebar .btn{flex:1}

/* brew cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{appearance:none;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink);font:inherit;cursor:pointer}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.card .bean{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.card .meta{font:400 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.stars{color:var(--amber);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.tagline{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.diag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2)}
.diag.sour{color:var(--sour)} .diag.bitter{color:var(--bitter)} .diag.ok{color:var(--good)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:24px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* compass (brew control grid) */
.compass{display:grid;grid-template-columns:auto 1fr 1fr 1fr;grid-template-rows:auto repeat(3,1fr);gap:6px;align-items:stretch}
.compass .ax{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.compass .ax.row{writing-mode:vertical-rl;transform:rotate(180deg);padding:0 2px}
.cell{appearance:none;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;min-height:52px;font:500 12px var(--body);color:var(--muted);cursor:pointer;padding:4px;line-height:1.2}
.cell.mid{border-style:dashed;border-color:var(--good);color:var(--good)}
.cell.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-style:solid}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.compass.mini .cell{min-height:22px;font-size:0;cursor:default}
.tip{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.tip:empty{display:none}

/* sliders */
.slider{display:grid;grid-template-columns:92px 1fr 28px;align-items:center;gap:10px}
.slider span{font-size:14px}
.slider output{font:500 15px var(--mono);text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.rate{display:flex;gap:4px}
.rate button{appearance:none;border:0;background:none;font-size:32px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.rate button.on{color:var(--amber)}
.rate button:focus-visible{outline:2px solid var(--accent);border-radius:6px}

/* timer */
.timer{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.tdisp{font:500 52px var(--mono);text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.laps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--mono);font-size:13px}
.laps span{background:var(--surface-2);border-radius:6px;padding:3px 8px}

/* bars (detail + insights) */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:100px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar b{font:500 13px var(--mono);text-align:right}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px 16px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font:500 16px var(--mono);overflow-wrap:anywhere}
.kv .v.txt{font-family:var(--body);font-weight:500}
.quote{border-left:3px solid var(--accent);padding-left:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}

/* beans */
.age{display:flex;align-items:center;gap:8px;font-size:13px}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2)}
.st.rest{color:var(--amber)} .st.ready{color:var(--good)} .st.old{color:var(--muted)}
.left{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.left div{height:100%;background:var(--amber)}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.sheet{max-height:85%;overflow-y:auto}
/* valve steps */
.vrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto auto;gap:8px;align-items:center}
.vrow .btn{min-height:46px;padding:0 12px}
.vrow .x{min-width:46px;padding:0}
details.inner{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
details.inner[open]{display:flex}
details.inner summary{cursor:pointer;font-weight:600;list-style:none}
details.inner summary::-webkit-details-marker{display:none}
details.inner summary::after{content:"＋";float:right;color:var(--muted)}
details.inner[open] summary::after{content:"－"}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.divider{border-top:1px solid var(--line);margin:2px 0}
.tsrc{font-size:13px;line-height:1.45;color:var(--muted)}
.tsrc b{color:var(--ink)}
/* last brew card */
.last{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.last .nx{font-size:16px;line-height:1.45}
.last .nx b{color:var(--accent)}
.last .meta{font:400 13px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.hashes{display:flex;flex-wrap:wrap;gap:4px 10px}
.hash{font:600 14px var(--body);color:var(--accent)}
.prof{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:13px}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--surface-2)}
.pips i.on{background:var(--accent)}
.pipset{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pipset button{appearance:none;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--mono);cursor:pointer}
.pipset button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pipset button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clicker{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.clicker .btn{font-size:26px;min-height:56px;padding:0}
.cval{display:flex;align-items:baseline;justify-content:center;gap:8px}
.cval .mono{font-size:40px;font-weight:500}
.gscale{position:relative;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-top:2px}
.gscale .zone{position:absolute;top:-12px;height:4px;background:var(--good);opacity:.6;border-radius:2px}
.tip.warn{background:var(--surface);border:1.5px solid var(--amber)}
.ver{font:400 12px var(--mono);color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center}
.toast.err{background:var(--danger);color:#fff}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:360px){.grid3{grid-template-columns:1fr 1fr}.slider{grid-template-columns:80px 1fr 24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="appbar gut"><div class="col">
    <p class="mark"><b>Lulu</b>FilterCoffee</p>
    <span class="sub" id="sub"></span>
  </div></header>
  <main id="main"><div class="col gut" id="view"></div></main>
  <nav class="tabs gut" aria-label="Sections"><div class="col">
    <button class="tab" data-tab="journal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>Journal</button>
    <button class="tab" data-tab="history" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/><path d="M11 8v3l2 1.5"/></svg>History</button>
    <button class="tab" data-tab="brew" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16l-6 8v5h-4v-5z"/><path d="M12 2v2"/></svg>Brew</button>
    <button class="tab" data-tab="beans" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(35 12 12)"/><path d="M8.5 18c1.5-3 1-5.5 3.5-8s2.5-4 3.5-5"/></svg>Beans</button>
    <button class="tab" data-tab="insights" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
  </div></nav>
</div>
<input id="fileInput" type="file" accept=".json,application/json,text/plain" class="vh" tabindex="-1" aria-hidden="true">
<div class="scrim" id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ===== constants ===== */
const KEY='lulu.data.v1';
const BREWERS=['V60','Hario Switch','Kalita Wave','Origami','Chemex','AeroPress','April','Orea','Other'];
const PROCESSES=['Washed','Natural','Honey','Anaerobic','Other'];
const ROASTS=['Light','Medium-light','Medium','Medium-dark','Dark'];
const FILTERS=['Hario tabbed','Hario untabbed','Cafec Abaca','Cafec T-90','Sibarist Fast','Kalita Wave 185','Origami cone','Chemex bonded'];
const GRINDERS=['Comandante C40','1Zpresso K-Ultra','1Zpresso ZP6','Timemore C3','Kingrinder K6','Fellow Ode 2','Baratza Encore'];
const FLAVORS={'Fruity':['Berry','Citrus','Stone fruit','Tropical','Apple','Grape'],'Floral':['Jasmine','Bergamot','Rose'],'Sweet':['Caramel','Honey','Brown sugar','Chocolate','Vanilla'],'Nutty':['Almond','Hazelnut','Peanut'],'Tea-like':['Black tea','Green tea','Oolong'],'Other':['Winey','Spice','Earthy','Smoky','Herbal']};
const ATTRS=[['acidity','Acidity'],['sweetness','Sweetness'],['body','Body'],['bitterness','Bitterness'],['aftertaste','Aftertaste']];
const EXS=[['sour','Sour'],['ok','Balanced'],['bitter','Bitter']];
const STS=[['strong','Strong'],['ok','Balanced'],['weak','Weak']];

/* ===== storage ===== */

const $=s=>document.querySelector(s);

const num=v=>{if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmtT=s=>{if(s==null||!isFinite(s))return '';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function parseT(v){v=String(v||'').trim().replace('.',':');if(!v)return null;if(v.includes(':')){const[m,s]=v.split(':');const mm=parseInt(m),ss=parseInt(s);if(!isFinite(mm)&&!isFinite(ss))return null;return (mm||0)*60+(ss||0)}const n=parseInt(v);return isFinite(n)?n:null}

function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function ago(ts){const d=Math.floor((Date.now()-ts)/DAY);if(d<=0){const h=Math.floor((Date.now()-ts)/3600000);return h<=0?'just now':h+' h ago'}return d===1?'yesterday':d+' days ago'}
function toLocalInput(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function daysOff(bean,at){if(!bean||!bean.roastDate)return null;const r=new Date(bean.roastDate+'T00:00:00').getTime();if(!isFinite(r))return null;return Math.floor(((at||Date.now())-r)/DAY)}
const day0=s=>{const t=new Date(s+'T00:00:00').getTime();return isFinite(t)?t:null};
const today0=()=>day0(isoDay(Date.now()));
const fmtDay=ts=>new Date(ts).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
function restInfo(b){
  const days=num(b&&b.restDays);if(!days)return null;
  const s=b.restStart?day0(b.restStart):null;
  if(s==null)return {state:'wait',days};
  const passed=Math.round((today0()-s)/DAY),left=days-passed,ready=s+days*DAY;
  if(passed<0)return {state:'wait',days,startsIn:-passed,start:s};
  return left>0?{state:'resting',days,passed,left,ready}:{state:'ready',days,ready,since:-left};
}
function restText(r){
  if(!r)return '';
  if(r.state==='wait')return r.startsIn?'Rest starts in '+r.startsIn+' day'+(r.startsIn>1?'s':''):'Rest '+r.days+' days, not started yet';
  if(r.state==='resting')return 'Rested '+r.passed+' of '+r.days+' days · ready in '+r.left+' day'+(r.left>1?'s':'')+' ('+fmtDay(r.ready)+')';
  return 'Rested '+r.days+' days · ready'+(r.since?' since '+fmtDay(r.ready):' today');
}
function restState(d){if(d==null)return null;if(d<5)return['rest','Resting'];if(d<=35)return['ready','In its window'];return['old','Past peak']}

function dialTips(ex,st){
  const t=[];
  if(ex==='sour')t.push('<b>Sour, sharp or salty</b> usually means under-extracted. Grind finer first. You can also raise the water 1 to 2 °C or let it brew a little longer.');
  if(ex==='bitter')t.push('<b>Bitter, dry or harsh</b> usually means over-extracted. Grind coarser first. You can also drop the water 2 to 3 °C or shorten the brew.');
  if(st==='weak')t.push('<b>Weak or watery:</b> use more coffee for the same water, for example move from 1:17 toward 1:15.');
  if(st==='strong')t.push('<b>Too strong or heavy:</b> use more water for the same dose, for example move from 1:15 toward 1:17.');
  if(ex==='ok'&&st==='ok')t.push('<b>Sweet spot.</b> Keep this recipe. If you want to explore, change only one thing next time.');
  if(t.length&&!(ex==='ok'&&st==='ok'))t.push('Change one variable at a time so you know what made the difference.');
  return t.map(x=>'<span>'+x+'</span>').join('');
}

function brewCard(b){

  return '<button type="button" class="card" data-act="open" data-id="'+b.id+'">'+
    '<div class="top"><span>'+fmtDate(b.at)+'</span><span class="chips"><span class="chip sm">'+esc(b.brewer||'—')+'</span>'+(b.ex?'<span class="badge">Example</span>':'')+'</span></div>'+
    '<div class="bean">'+esc(b.beanName||'Unnamed coffee')+'</div>'+
    (meta?'<div class="meta">'+meta+'</div>':'')+
    '<div class="foot">'+stars(b.rating)+'<span class="tagline">'+esc((b.notes||[]).join(' · '))+'</span>'+diagLabel(b)+'</div></button>';

function vJournal(){
  const bs=db.brews, rated=bs.filter(b=>b.rating);
  const avg=rated.length?(rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1):'—';
  const last=bs.length?ago(Math.max(...bs.map(b=>b.at))):'—';
  const week=bs.filter(b=>Date.now()-b.at<7*DAY).length;
  const hasEx=db.brews.some(b=>b.ex)||db.beans.some(b=>b.ex);
  const recent=sortedBrews().slice(0,5);
  const ready=db.beans.filter(b=>!b.finished).map(b=>[b,restInfo(b)]).filter(x=>x[1]&&x[1].state==='resting'&&x[1].left<=3);
  return '<h1>Brew journal</h1>'+
   '<div class="stats"><div class="stat"><span class="v">'+week+'</span><span class="k">brews this week</span></div><div class="stat"><span class="v">'+avg+'</span><span class="k">average rating</span></div><div class="stat"><span class="v" style="font-size:16px">'+last+'</span><span class="k">last brew</span></div></div>'+
   (backupDue()?'<div class="tip warn"><span><b>Time to back up.</b> '+esc(backupLine())+'. Save a copy to the Files app so a cleared phone never costs you your journal.</span><div class="btnrow"><button type="button" class="btn sm" data-act="export">Back up now</button><button type="button" class="btn alt sm" data-act="snooze">Remind me tomorrow</button></div></div>':'')+
   (hasEx?'<div class="tip"><span>The cards marked <b>Example</b> show how a log looks. Remove them any time in Insights.</span></div>':'')+
   (ready.length?'<div class="tip">'+ready.map(([b,r])=>'<span><b>'+esc(b.name)+'</b> is ready in '+r.left+' day'+(r.left>1?'s':'')+' ('+fmtDay(r.ready)+').</span>').join('')+'</div>':'')+
   '<button class="btn" type="button" data-act="newBrew">＋ Log a new brew</button>'+
   (bs.length?'<div class="month">Recent brews<span>'+recent.length+' of '+bs.length+'</span></div><div class="list">'+recent.map(brewCard).join('')+'</div>'+

const HF0={q:'',from:'',to:'',range:'all',bean:'',brewer:'',minRating:'',taste:'',strength:'',flavor:'',grinder:'',sort:'new'};

function historyResults(){
  let list=db.brews.slice();const q=hf.q.trim().toLowerCase();
  if(hf.from){const f=day0(hf.from);if(f!=null)list=list.filter(b=>b.at>=f)}
  if(hf.to){const t=day0(hf.to);if(t!=null)list=list.filter(b=>b.at<t+DAY)}
  if(hf.bean)list=list.filter(b=>(b.beanName||'Unnamed coffee')===hf.bean);
  if(hf.brewer)list=list.filter(b=>b.brewer===hf.brewer);
  if(hf.grinder)list=list.filter(b=>b.grinder===hf.grinder);
  if(hf.minRating)list=list.filter(b=>(b.rating||0)>=+hf.minRating);
  if(hf.taste)list=list.filter(b=>b.extraction===hf.taste);
  if(hf.strength)list=list.filter(b=>b.strength===hf.strength);
  if(hf.flavor)list=list.filter(b=>(b.notes||[]).includes(hf.flavor));
  if(q)list=list.filter(b=>[b.beanName,b.brewer,b.grind,b.grinder,b.filter,b.method,b.comment,b.next,(b.notes||[]).join(' ')].join(' ').toLowerCase().includes(q));
  const s=hf.sort;

}

  const typed=parseT(d.timeStr),manual=d.timeSrc==='manual'&&typed!=null,te=Math.round(elapsed()/1000);
  const tm=typed!=null?typed:(te>0?te:null);
  const rec={id:d.id||uid(),at:d.at||Date.now(),beanId:bean?bean.id:'',beanName:bean?bean.name:(d.beanName||'').trim(),brewer,
    filter:(d.filter||'').trim(),grinder:(d.grinder||'').trim(),grind:(d.grind||'').trim(),dose:num(d.dose),water:num(d.water),temp:num(d.temp),
    bloomWater:num(d.bloomWater),bloomTime:num(d.bloomTime),pours:num(d.pours),time:tm,method:(d.method||'').trim(),laps:manual?[]:(d.laps||[]),
    valve:(d.valve||[]).map(r=>({state:r.state==='open'?'open':'close',t:parseT(r.str)})).filter(r=>r.t!=null),
    extraction:d.extraction||'',strength:d.strength||'',acidity:+d.acidity||3,sweetness:+d.sweetness||3,body:+d.body||3,bitterness:+d.bitterness||2,aftertaste:+d.aftertaste||3,

const timer={running:false,t0:0,acc:0,laps:[],raf:0};
let wake=null;
const elapsed=()=>timer.acc+(timer.running?performance.now()-timer.t0:0);
function fmtMs(ms){const s=ms/1000;return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')+'.'+Math.floor((s*10)%10)}
function paintTimer(){const d=$('#tDisp');if(!d)return;d.textContent=fmtMs(elapsed());const b=$('#tStart');if(b)b.textContent=timer.running?'Pause':(timer.acc?'Resume':'Start');
  const l=$('#tLaps');if(l&&draft){const h=(draft.laps||[]).map((x,i)=>'<span>Pour '+(i+1)+' · '+fmtT(x)+'</span>').join('');if(l.innerHTML!==h)l.innerHTML=h}

/* ===== export / import ===== */

function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())}
async function offer(filename,data,okMsg){
  const type=filename.endsWith('.csv')?'text/csv':'application/json';
  let file;try{file=new File([data],filename,{type})}catch(e){file=null}
  if(file&&navigator.canShare&&navigator.share){
    let ok=false;try{ok=navigator.canShare({files:[file]})}catch(e){}
    if(ok){try{await navigator.share({files:[file]});toast(okMsg);return true}catch(e){if(e&&e.name==='AbortError'){toast('Export cancelled.',true);return false}}}
  }
  try{const url=URL.createObjectURL(file||new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(okMsg);return true}
  catch(e){toast('Export failed. Please try again.',true);return false}
}
function csv(){
  const cols=[['Date',b=>new Date(b.at).toLocaleString()],['Coffee',b=>b.beanName],['Brewer',b=>b.brewer],['Filter',b=>b.filter],['Grinder',b=>b.grinder],['Grind',b=>b.grind],['Dose g',b=>b.dose],['Water g',b=>b.water],['Ratio',b=>{const r=ratioOf(b.dose,b.water);return r?r.toFixed(1):''}],['Temp C',b=>b.temp],['Bloom g',b=>b.bloomWater],['Bloom s',b=>b.bloomTime],['Pours',b=>b.pours],['Time',b=>fmtT(b.time)],['Valve',b=>valveText(b.valve)],['Extraction',b=>b.extraction],['Strength',b=>b.strength],...ATTRS.map(a=>[a[1],b=>b[a[0]]]),['Flavors',b=>(b.notes||[]).join('; ')],['Rating',b=>b.rating],['TDS',b=>b.tds],['Bev g',b=>b.bev],['Notes',b=>b.comment],['Next time',b=>b.next],['Method',b=>b.method]];
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '﻿'+[cols.map(c=>q(c[0])).join(','),...sortedBrews().map(b=>cols.map(c=>q(c[1](b))).join(','))].join('\n');
}

    case 'beanHistory':{const b=beanById(id);hf={...HF0,bean:b.name};go('history');break}
    case 'restToday':{const b=beanById(id);b.restStart=isoDay(Date.now());persist();toast('Resting started. Ready on '+fmtDay(restInfo(b).ready)+'.');render();break}
    case 'restDaysPick':beanDraft.restDays=+v;$('#b-restDays').value=v;t.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));$('#restPreview').textContent=restText(restInfo(beanDraft));break;
    case 'restStartToday':beanDraft.restStart=isoDay(Date.now());$('#b-restStart').value=beanDraft.restStart;$('#restPreview').textContent=restText(restInfo(beanDraft));break;
    case 'newBrew':if(!draft||draft._edit)draft=newDraft();go('brew');break;
    case 'again':{const b=db.brews.find(x=>x.id===id);draft=draftFrom(b,false);resetTimer();go('brew');toast('Recipe copied. Brew, then rate the new cup.');break}
    case 'edit':{const b=db.brews.find(x=>x.id===id);draft=draftFrom(b,true);go('brew');break}
    case 'delBrew':sheet({title:'Delete this brew?',text:'This removes it from your journal. It cannot be undone unless you have a backup.',ok:'Delete',danger:true,onOk:()=>{db.brews=db.brews.filter(x=>x.id!==id);persist();toast('Brew deleted');go('journal')}});break;
    case 'cancelEdit':{const back=draft&&draft.id;draft=null;go('detail',{id:back});break}
    case 'clearDraft':draft=newDraft();resetTimer();render();toast('Form cleared');break;
    case 'pick':draft[t.dataset.f]=v;t.parentElement.querySelectorAll('.chip').forEach(c=>{c.classList.toggle('on',c===t);c.setAttribute('aria-pressed',c===t)});if(t.dataset.f==='brewer'){$('#f-brewerOther').hidden=v!=='Other';if(v==='Hario Switch'){if(!draft.valve.length){draft.valve=[{state:'close',str:'0:00'},{state:'open',str:''}];$('#valveRows').innerHTML=valveRowsHTML()}$('#valveBox').open=true}}break;
    case 'useLast':{const b=db.brews.find(x=>x.id===id);if(b)applyLast(b);break}
    case 'vAdd':{const last=draft.valve[draft.valve.length-1];const e=Math.round(elapsed()/1000);draft.valve.push({state:last&&last.state==='close'?'open':'close',str:timer.running&&e?fmtT(e):''});$('#valveRows').innerHTML=valveRowsHTML();break}
    case 'vNow':{const i=+t.dataset.i,e=Math.round(elapsed()/1000);if(!timer.running&&!e){toast('Start the timer first, or type the time.',true);return}draft.valve[i].str=fmtT(e);$('#valveRows').innerHTML=valveRowsHTML();break}
    case 'vDel':draft.valve.splice(+t.dataset.i,1);$('#valveRows').innerHTML=valveRowsHTML();break;
    case 'ratio':{const d=num(draft.dose);if(!d){toast('Enter the coffee dose first.',true);return}draft.water=Math.round(d*(+v));$('#f-water').value=draft.water;refreshComputed();break}
    case 'grid':draft.extraction=t.dataset.ex;draft.strength=t.dataset.st;$('#compassWrap').innerHTML=compassHTML(draft.extraction,draft.strength);refreshComputed();break;
    case 'tag':{const i=draft.notes.indexOf(v);if(i>=0)draft.notes.splice(i,1);else draft.notes.push(v);if(t.closest('#customTags')){t.remove()}else{t.classList.toggle('on',i<0);t.setAttribute('aria-pressed',i<0)}break}
    case 'addTag':{const inp=$('#f-tag');const val=(inp.value||'').trim();if(!val)return;if(!draft.notes.includes(val)){draft.notes.push(val);$('#customTags').insertAdjacentHTML('beforeend','<button type="button" class="chip on" data-act="tag" data-v="'+esc(val)+'" aria-pressed="true">'+esc(val)+' ✕</button>')}inp.value='';break}
    case 'rate':draft.rating=+v===draft.rating?0:+v;t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v<=draft.rating));break;
    case 'saveBrew':saveBrew();break;
    case 'tStart':if(timer.running){timer.acc=elapsed();timer.running=false;cancelAnimationFrame(timer.raf);paintTimer()}else{timer.t0=performance.now();timer.running=true;grabWake();tick()}break;
    case 'tLap':if(!timer.running&&!timer.acc){timer.t0=performance.now();timer.running=true;grabWake();tick()}draft.laps.push(Math.round(elapsed()/1000));paintTimer();break;
    case 'tReset':resetTimer();if(draft)draft.laps=[];paintTimer();break;
    case 'tUse':{const s=Math.round(elapsed()/1000);if(!s){toast('Start the timer first.',true);return}draft.timeStr=fmtT(s);draft.timeSrc='timer';$('#f-time').value=draft.timeStr;timeStatus();toast('Total time set to '+draft.timeStr);break}
    case 'newBean':beanDraft=null;go('bean');break;
    case 'editBean':{const b=beanById(id);beanDraft={...b,_edit:true};go('bean');break}
    case 'brewBean':draft=newDraft();draft.beanId=id;go('brew');showLast(id);break;
    case 'finishBean':{const b=beanById(id);b.finished=!b.finished;persist();toast(b.finished?'Moved to finished bags':'Back on the shelf');render();break}
    case 'grinderPick':{const inp=$('#f-grinder');if(v){draft.grinder=v;inp.hidden=true}else{if(grinderList().includes(draft.grinder))draft.grinder='';inp.value=draft.grinder;inp.hidden=false;inp.focus()}
      $('#grinderChips').innerHTML=grinderChipsHTML();$('#grindBox').innerHTML=grindHTML();break}
    case 'gstep':setClicks((clicksOf(draft.grind)||0)+(+v));break;
    case 'bpip':{const f=t.dataset.f;beanDraft[f]=+beanDraft[f]===+v?null:+v;t.parentElement.querySelectorAll('button').forEach(x=>{const on=+x.dataset.v===+beanDraft[f];x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});break}
    case 'bpick':beanDraft[t.dataset.f]=v;if(t.dataset.f==='process'){const po=$('#b-processOther');po.hidden=v!=='Other';if(v==='Other')po.focus()}t.parentElement.querySelectorAll('.chip').forEach(c=>{c.classList.toggle('on',c===t);c.setAttribute('aria-pressed',c===t)});break;
    case 'saveBean':saveBean();break;
    case 'delBean':sheet({title:'Delete this coffee?',text:'Your brews with it stay in the journal and keep its name.',ok:'Delete',danger:true,onOk:()=>{db.beans=db.beans.filter(x=>x.id!==id);db.brews.forEach(x=>{if(x.beanId===id)x.beanId=''});persist();beanDraft=null;toast('Coffee deleted');go('beans')}});break;
    case 'export':{if(!db.brews.length&&!db.beans.length){toast('Nothing to export yet.',true);return}offer('LuluFilterCoffee-backup-'+stamp()+'.json',JSON.stringify({app:'LuluFilterCoffee',version:1,exportedAt:new Date().toISOString(),brews:db.brews,beans:db.beans},null,2),'Backup saved').then(ok=>{if(ok){meta.lastBackup=Date.now();meta.changes=0;meta.snooze=0;saveMeta();render()}});break}
    case 'snooze':meta.snooze=Date.now()+DAY;saveMeta();render();toast('I will remind you tomorrow.');break;
    case 'loadEx':db=seed();persist();meta.changes=0;saveMeta();toast('Example data added');go('journal');break;
    case 'csv':if(!db.brews.length){toast('No brews to export yet.',true);return}offer('LuluFilterCoffee-brews-'+stamp()+'.csv',csv(),'Spreadsheet exported');break;
    case 'load':$('#fileInput').value='';$('#fileInput').click();break;
    case 'clearEx':sheet({title:'Remove example data?',text:'This removes the example coffees and brews. Your own entries stay.',ok:'Remove',danger:true,onOk:()=>{db.brews=db.brews.filter(b=>!b.ex);db.beans=db.beans.filter(b=>!b.ex);persist();toast('Examples removed');render()}});break;
    case 'sheetNo':closeSheet();break;
    case 'sheetYes':{const f=sheetAction;closeSheet();f&&f();break}
  }
});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)closeSheet();if(e.key==='Enter'&&e.target.id==='f-tag'){e.preventDefault();$('[data-act="addTag"]').click()}});
function onField(e){
  const t=e.target;
  if(t.dataset.f&&draft){
    const f=t.dataset.f,prev=draft[f];
    if(f==='atLocal'){const ts=new Date(t.value).getTime();if(isFinite(ts))draft.at=ts}
    else draft[f]=t.value;
    if(f==='beanId'){$('#f-beanName').hidden=!!t.value;$('#beanInfo').innerHTML=beanInfo(t.value);$('#lastBox').innerHTML=lastBoxHTML(t.value);if(t.value&&t.value!==prev)showLast(t.value)}
    if(f==='grinder'){$('#grindBox').innerHTML=grindHTML()}
    if(f==='timeStr'){draft.timeSrc=t.value.trim()?'manual':'';timeStatus()}
    const o=$('#o-'+f);if(o)o.textContent=t.value;
    refreshComputed();
  }
  if(t.id==='gRange'&&draft){setClicks(+t.value);return}
  if(t.dataset.vf&&draft){const r=draft.valve[+t.dataset.i];if(r)r[t.dataset.vf]=t.value}
  if(t.dataset.bf&&beanDraft){beanDraft[t.dataset.bf]=t.value;if(t.dataset.bf==='tasteStr'){const tp=$('#tastePreview');if(tp)tp.innerHTML=hashHTML(parseTastes(t.value))}const rp=$('#restPreview');if(rp&&(t.dataset.bf==='restDays'||t.dataset.bf==='restStart')){rp.textContent=restText(restInfo(beanDraft));document.querySelectorAll('[data-act="restDaysPick"]').forEach(c=>c.classList.toggle('on',c.dataset.v===String(num(beanDraft.restDays))))}}
  if(t.dataset.hf){hf[t.dataset.hf]=t.value;if(t.dataset.hf==='from'||t.dataset.hf==='to'){hf.range='';document.querySelectorAll('[data-act="hrange"]').forEach(c=>c.classList.remove('on'))}refreshHistory()}
}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'||e.target.type==='date')onField(e)});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('toggle',e=>{if(e.target.id==='hpanel')hfOpen=e.target.open},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&timer.running)grabWake()});

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
